<footer class="site-footer">
  <div class="container footer-row">
    <div>
      <div class="footer-social">
        <a class="footer-social__link" href="https://x.com/TheoChem_EHU" target="_blank" rel="noopener" aria-label="X (Twitter) - Kimika Teorikoa">
          {{ partial "social-icon.html" (dict "network" "x") }}
        </a>

        <a class="footer-social__link" href="https://blueskydirectory.com/profiles/theochemehu.bsky.social" target="_blank" rel="noopener" aria-label="Bluesky - Kimika Teorikoa">
          {{ partial "social-icon.html" (dict "network" "bluesky") }}
        </a>

        <a class="footer-social__link" href="https://github.com/KimikaTeorikoa" target="_blank" rel="noopener" aria-label="GitHub - Kimika Teorikoa">
          {{ partial "social-icon.html" (dict "network" "github") }}
        </a>
      </div>

      {{ with site.Params.footer_note }}
        <p class="footer-copy">{{ . }}</p>
      {{ end }}
    </div>
    <div class="footer-institutions" aria-label="Institutional links">
      <a class="institution-logo institution-logo--dipc" href="https://dipc.ehu.eus/" aria-label="DIPC">
        <img src="{{ "images/institutions/dipc.svg" | absURL }}" alt="DIPC">
      </a>
      <a class="institution-logo institution-logo--ehu" href="https://www.ehu.eus" aria-label="EHU">
        <img src="{{ "images/institutions/ehu.svg" | absURL }}" alt="EHU">
      </a>
      <a class="institution-logo institution-logo--ikerbasque" href="https://www.ikerbasque.net" aria-label="Ikerbasque">
        <img src="{{ "images/institutions/ikerbasque.png" | absURL }}" alt="Ikerbasque">
      </a>
    </div>
  </div>
</footer>
